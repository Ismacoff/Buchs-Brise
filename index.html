th:90%;z-index:5}.login{max-width:450px;margin:0 auto}@media(max-width:620px){.grid,.toolbar{grid-template-columns:1fr}.wide{grid-column:auto}.row{grid-template-columns:1fr}.amount{text-align:left}}

<script>
const SUPABASE_URL='https://gmcizmqvjowswqrlmkvn.supabase.co';const SUPABASE_KEY='sb_publishable_q09PJmA-ikYZW0KU_O8e4A_neFLcXW2';let sb,docs=[];const $=x=>document.getElementById(x);sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const number=v=>{if(v===null||v===undefined||v==='')return null;let s=String(v).trim().replace(/\s/g,'').replace(/€/g,'');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}else if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.');}let n=Number(s);return isFinite(n)?n:null};function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}

$('loginBtn').onclick=async e=>{e.preventDefault();let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return toast('Bitte E-Mail und Passwort eingeben.');let {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return toast('Anmeldung fehlgeschlagen: '+error.message);view(data.session)};$('logout').onclick=()=>sb.auth.signOut();sb.auth.onAuthStateChange((e,s)=>view(s));sb.auth.getSession().then(({data})=>view(data.session));
function euroCandidates(text){return [...text.matchAll(/(?:€|EUR)?\s*(\d{1,5}(?:[. ]\d{3})*[,.]\d{2})\s*(?:€|EUR)?/gi)].map(m=>({raw:m[1],n:Number(m[1].replace(/[. ]/g,'').replace(',','.'))})).filter(x=>isFinite(x.n))}
function parseReceipt(text){let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);let date='';let dm=text.match(/\b(0?[1-9]|[12]\d|3[01])[.\/-](0?[1-9]|1[0-2])[.\/-](20\d{2}|\d{2})\b/);if(dm){let y=dm[3].length===2?'20'+dm[3]:dm[3];date=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`}
let amounts=euroCandidates(text),gross='';let totalLine=lines.filter(l=>/(gesamt|summe|total|zu zahlen|endbetrag|betrag)/i.test(l));let ta=totalLine.flatMap(euroCandidates);let g=(ta.length?ta:amounts).sort((a,b)=>b.n-a.n)[0];if(g)gross=g.n.toFixed(2).replace('.',',');
let tax='';let taxLine=lines.filter(l=>/(mwst|ust|umsatzsteuer|mehrwertsteuer|vat)/i.test(l));let taxAmounts=taxLine.flatMap(euroCandidates).filter(x=>!g||x.n<g.n);if(taxAmounts.length)tax=taxAmounts.sort((a,b)=>b.n-a.n)[0].n.toFixed(2).replace('.',',');
let bad=/^(rechnung|kassenbon|beleg|quittung|datum|filiale|tel|www\.|http|steuer|ust|mwst)/i;let vendor=lines.slice(0,10).find(l=>l.length>2&&l.length<60&&/[A-Za-zÄÖÜäöüß]/.test(l)&&!bad.test(l))||'';vendor=vendor.replace(/[^A-Za-z0-9ÄÖÜäöüß& .,'+\-]/g,' ').replace(/\s+/g,' ').trim();
let lower=text.toLowerCase(),cat='Sonstiger Beleg';let rules=[['Einrichtung & Möbel',['möbel','ikea','jysk','stuhl','tisch','schrank','bett']],['Reparatur & Instandhaltung',['baumarkt','hornbach','bauhaus','obi','reparatur','werkzeug','farbe','schraube']],['Strom / Wasser / Heizung',['strom','energie','wasser','heizung','gas','brennholz']],['Reinigung & Wäsche',['reinigung','wasch','wäsche','putz','spülmittel']],['Garten & Außenbereich',['garten','pflanze','rasen','erde']],['Versicherung',['versicherung','police','beitrag']],['Internet & Telefon',['telekom','vodafone','internet','telefon']],['Vermietungsplattform / Gebühren',['booking','airbnb','fewo','provision']],['Werbung & Website',['domain','hosting','werbung','website']],['Fahrt- / Reisekosten',['tankstelle','shell','aral','esso','bahn','parkgebühr']],['Anschaffung / Anlagegut',['gerät','maschine','fernseher','kühlschrank','spülmaschine']]];for(let [c,ks] of rules)if(ks.some(k=>lower.includes(k))){cat=c;break}return{date,gross,tax,vendor,cat}}
$('file').addEventListener('change',async()=>{let f=$('file').files[0];if(!f)return;let s=$('scanstatus');s.classList.remove('hidden');if(f.type==='application/pdf'){s.textContent='PDF ausgewählt. Automatische Foto-Erkennung arbeitet derzeit mit JPG/PNG; PDF kann gespeichert werden.';return}try{s.textContent='🔎 Beleg wird gelesen … 0 %';let r=await Tesseract.recognize(f,'deu+eng',{logger:m=>{if(m.status==='recognizing text')s.textContent='🔎 Beleg wird gelesen … '+Math.round((m.progress||0)*100)+' %'}});let p=parseReceipt(r.data.text||'');if(p.date)$('date').value=p.date;if(p.vendor)$('vendor').value=p.vendor;if(p.gross)$('gross').value=p.gross;if(p.tax)$('tax').value=p.tax;$('type').value=p.cat;s.textContent='✓ Analyse fertig – Daten wurden automatisch eingetragen. Bitte kurz prüfen.'}catch(e){s.textContent='Erkennung nicht möglich: '+e.message}});
async function load(){let {data,error}=await sb.from('documents').select('*').order('issue_date',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}docs=data||[];let vals=[...new Set(docs.map(x=>x.document_type).filter(Boolean))].sort();$('filter').innerHTML='<option value="">Alle Kategorien</option>'+vals.map(x=>'<option>'+esc(x)+'</option>').join('');render()}function shown(){let q=$('search').value.toLowerCase(),f=$('filter').value;return docs.filter(d=>(!f||d.document_type===f)&&(!q||[d.vendor,d.notes,d.file_name,d.document_type].some(x=>String(x||'').toLowerCase().includes(q))))}function render(){let a=shown();$('count').textContent=a.length;$('sum').textContent=money(a.reduce((s,d)=>s+Number(d.gross_amount||0),0));$('vat').textContent=money(a.reduce((s,d)=>s+Number(d.tax_amount||0),0));$('list').innerHTML=a.length?a.map(d=>`<div class="row" id="receipt-${d.id}"><div><div class="receipt-head"><h3 class="receipt-title">${esc(d.vendor||d.file_name)}</h3></div><div class="chips"><span class="chip">📅 ${d.issue_date?new Date(d.issue_date+'T12:00').toLocaleDateString('de-DE'):'ohne Datum'}</span><span class="chip">${esc(d.document_type)}</span></div><div class="fileline">${esc(d.file_name)}</div>${d.notes?'<div class="meta" style="margin-top:6px">'+esc(d.notes)+'</div>':''}</div><div><div class="amount">${d.gross_amount==null?'—':money(d.gross_amount)}</div><div class="actions"><button class="btn light mini" onclick="openFile('${d.id}')">Öffnen</button><button class="btn danger mini" onclick="del('${d.id}')">Löschen</button></div></div></div>`).join(''):'<div class="empty">Noch keine Belege.</div>'}$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;
$('form').onsubmit=async e=>{e.preventDefault();let file=$('file').files[0];if(!file)return toast('Bitte zuerst einen Beleg auswählen.');let btn=$('save');if(btn.dataset.busy==='1')return;btn.dataset.busy='1';btn.disabled=true;btn.classList.remove('saved');btn.classList.add('saving');btn.textContent='Beleg wird gespeichert …';try{let {data:{user}}=await sb.auth.getUser();let path=`${user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let u=await sb.storage.from('belege').upload(path,file,{contentType:file.type});if(u.error)throw u.error;let row={file_name:file.name,storage_path:path,document_type:$('type').value,issue_date:$('date').value||null,gross_amount:number($('gross').value),tax_amount:number($('tax').value),currency:'EUR',vendor:$('vendor').value||null,notes:$('notes').value||null};let r=await sb.from('documents').insert(row).select('id').single();if(r.error){await sb.storage.from('belege').remove([path]);throw r.error}let newId=r.data?.id;$('form').reset();$('type').value='Sonstiger Beleg';$('scanstatus').classList.add('hidden');btn.classList.remove('saving');btn.classList.add('saved');btn.textContent='✓ Beleg gespeichert';await load();document.querySelectorAll('.stat').forEach(x=>{x.classList.remove('bump');void x.offsetWidth;x.classList.add('bump')});if(newId){let el=document.getElementById('receipt-'+newId);if(el){el.classList.add('new-entry');setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),180)}}toast('Beleg sicher im Archiv gespeichert ✓');await new Promise(res=>setTimeout(res,1100))}catch(x){btn.classList.remove('saving','saved');btn.textContent='Erneut speichern';toast('Fehler: '+x.message);return}finally{btn.dataset.busy='0';btn.disabled=false;if(btn.textContent!=='Erneut speichern'){btn.classList.remove('saving','saved');btn.textContent='Beleg speichern'}}}
window.openFile=async id=>{let d=docs.find(x=>x.id===id);let {data,error}=await sb.storage.from('belege').createSignedUrl(d.storage_path,60);if(error)return toast(error.message);window.open(data.signedUrl,'_blank')};window.del=async id=>{let d=docs.find(x=>x.id===id);if(!confirm('Beleg wirklich löschen?'))return;let r=await sb.from('documents').delete().eq('id',id);if(r.error)return toast(r.error.message);await sb.storage.from('belege').remove([d.storage_path]);toast('Beleg gelöscht');load()};$('csv').onclick=()=>{let rows=[['Datum','Kategorie','Firma','Brutto EUR','MwSt EUR','Datei','Notiz'],...shown().map(d=>[d.issue_date||'',d.document_type||'',d.vendor||'',d.gross_amount??'',d.tax_amount??'',d.file_name||'',d.notes||''])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Buchs-und-Brise-Belege.csv';a.click();URL.revokeObjectURL(u)};

<script>
/* Buchs & Brise – Gemini-Belegerkennung V6.
   Der vorhandene Login-/Speicher-Code bleibt unverändert. */
(() => {
  const fileInput = document.getElementById("file");
  if (!fileInput) return;

  function status(msg, ok=false) {
    const el = document.getElementById("scanstatus");
    if (!el) return;
    el.classList.remove("hidden");
    el.textContent = msg;
  }

  function setField(id, value) {
    if (value === null || value === undefined || value === "") return;
    const el = document.getElementById(id);
    if (!el) return;
    el.value = value;
    el.dispatchEvent(new Event("input", {bubbles:true}));
    el.dispatchEvent(new Event("change", {bubbles:true}));
  }

  async function imageToBase64(file) {
    // Für Gemini verkleinern wir nur die Analyse-Kopie; das Original bleibt für das Archiv erhalten.
    const bitmap = await createImageBitmap(file);
    const maxSide = 1800;
    const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close?.();

    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.88));
    if (!blob) throw new Error("Foto konnte nicht vorbereitet werden.");

    return await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1]);
      r.onerror = () => reject(new Error("Foto konnte nicht gelesen werden."));
      r.readAsDataURL(blob);
    });
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files?.[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      status("PDF gespeichert – automatische KI-Erkennung ist in dieser Version für Fotos aktiviert.");
      return;
    }

    status("✨ KI analysiert den Beleg …");

    try {
      const base64 = await imageToBase64(file);

      // Verwendet die bereits angemeldete Supabase-Sitzung.
      const { data, error } = await sb.functions.invoke("analyze-receipt", {
        body: {
          image: base64,
          mimeType: "image/jpeg"
        }
      });

      if (error) throw error;
      if (!data || typeof data !== "object") throw new Error("Keine gültigen Belegdaten erhalten.");

      setField("vendor", data.vendor);
      setField("date", data.date);
      setField("gross", data.gross_amount);
      setField("tax", data.tax_amount);

      if (data.category) {
        const type = document.getElementById("type");
        if (type && [...type.options].some(o => o.value === data.category)) {
          type.value = data.category;
          type.dispatchEvent(new Event("change", {bubbles:true}));
        }
      }

      const bits = [];
      if (data.vendor) bits.push(data.vendor);
      if (data.date) bits.push(data.date);
      if (data.gross_amount != null) bits.push(Number(data.gross_amount).toFixed(2).replace(".", ",") + " €");
      if (data.tax_amount != null) bits.push("MwSt. " + Number(data.tax_amount).toFixed(2).replace(".", ",") + " €");

      status(bits.length
        ? "✓ KI erkannt: " + bits.join(" · ") + " — bitte kurz prüfen."
        : "⚠ Die KI konnte keine ausreichend sicheren Belegdaten erkennen."
      );
    } catch (e) {
      console.error("Gemini receipt analysis:", e);
      status("⚠ KI-Erkennung fehlgeschlagen: " + (e?.message || "Unbekannter Fehler"));
    }
  });
})();
</script>
